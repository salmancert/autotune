name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # So an APK can be built on demand without pushing anything.
  workflow_dispatch:

jobs:
  core:
    name: DSP and model tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # No Android SDK needed: settings.gradle.kts leaves :app out of the build
      # when none is configured, so the audio core is testable on a bare JVM.
      - name: Test audio core
        run: ./gradlew :audio-core:test

      - name: Test classifier and end-to-end stabilisation
        run: ./gradlew :model-training:test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "*/build/reports/tests/test"

  app:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # `packages: ''` is load-bearing. The action's default is
      # `tools platform-tools`, and Google has withdrawn the legacy `tools`
      # package from the SDK repository, so the default now fails on every
      # runner with "Failed to find package 'tools'" - taking the APK with it.
      # Nothing here needs it: the runner image ships platform-tools, and AGP
      # fetches the platform and build-tools it wants once licences are
      # accepted, which this action does.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install the compile SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      # Uploaded before lint runs, so a lint warning is never the reason there
      # is no APK to install. Not `if: always()`: when an earlier step fails
      # there is no APK, and demanding one then reports a second failure that
      # hides the first.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: autotune-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
